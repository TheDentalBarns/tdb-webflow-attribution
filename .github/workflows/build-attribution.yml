name: Build attribution distribution

on:
  push:
    branches:
      - main
    paths:
      - src/tdb-attribution.js
      - src/tdb-intent-tracking.js
      - .github/workflows/build-attribution.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build distribution
        run: |
          sed -i "s/const VERSION = '1.2.0';/const VERSION = '1.3.0';/" src/tdb-attribution.js
          cat src/tdb-attribution.js src/tdb-intent-tracking.js > dist/tdb-attribution.js
          npx --yes terser@5.31.6 dist/tdb-attribution.js \
            --compress \
            --mangle \
            --ecma 2020 \
            --output dist/tdb-attribution.min.js
          node --check src/tdb-attribution.js
          node --check src/tdb-intent-tracking.js
          node --check dist/tdb-attribution.js
          node --check dist/tdb-attribution.min.js

      - name: Commit generated files
        run: |
          if git diff --quiet -- src/tdb-attribution.js dist/tdb-attribution.js dist/tdb-attribution.min.js; then
            echo "Distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tdb-attribution.js dist/tdb-attribution.js dist/tdb-attribution.min.js
          git commit -m "build: publish attribution v1.3.0 distribution [skip ci]"
          git push
